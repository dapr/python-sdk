[project]
name = "dapr"
dynamic = ["version"]
description = "The official release of Dapr Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Dapr Authors", email = "dapr@dapr.io"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "protobuf>=6.33.5,<8.0.0",
    "grpcio>=1.81.1,<2.0.0",
    "grpcio-status>=1.81.1,<2.0.0",
    "aiohttp>=3.9.5,<4.0.0",
    "python-dateutil>=2.8.1,<3.0.0",
    "typing-extensions>=4.4.0,<5.0.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.60.1,<1.0.0",
    "uvicorn>=0.11.6,<1.0.0",
]
flask = [
    "Flask>=1.1.4,<4.0.0",
]
grpc = [
    "cloudevents>=1.0.0,<2.0.0",
]
langgraph = [
    "langgraph>=0.3.6,<2.0.0",
    "langchain>=0.1.17,<2.0.0",
    "python-ulid>=3.0.0,<5.0.0",
    "msgpack>=1.0,<2.0",
]
strands = [
    "strands-agents>=1.30.0,<2.0.0",
    "python-ulid>=3.0.0,<5.0.0",
    "msgpack>=1.0,<2.0",
]
# workflow has no third-party runtime deps beyond core dapr. The empty extra
# exists so users get a consistent `pip install dapr[<ext>]` shape and so the
# extra is reserved if workflow ever grows external deps.
workflow = []
# rag bundles only the embedder (the one adapter every rag pipeline needs);
# every cloud source, vector store, and parser is its own extra below so
# installing `dapr[rag]` never pulls in boto3/azure/pinecone/psycopg/
# unstructured a given user doesn't need. `pip install "dapr[rag,rag-s3,
# rag-pgvector]"` mirrors the S3 + pgvector example in dapr/ext/rag/AGENTS.md.
rag = [
    "openai>=1.50.0,<2.0.0",
]
rag-langchain = [
    "langchain-core>=0.3.0,<2.0.0",
]
rag-unstructured = [
    "unstructured[md,pdf,docx]>=0.15.0,<1.0.0",
]
rag-s3 = [
    "boto3>=1.34.0,<2.0.0",
]
rag-azure = [
    "azure-storage-blob>=12.19.0,<13.0.0",
    "azure-identity>=1.15.0,<2.0.0",
]
rag-pgvector = [
    "psycopg[binary]>=3.1.0,<4.0.0",
]
rag-pinecone = [
    "pinecone>=5.0.0,<8.0.0",
]
# Separate from rag-azure (azure-storage-blob/-identity): a different SDK
# package (azure-search-documents) for a different Azure service, needed only
# by AzureAISearchVectorStore. AzureOpenAIEmbedder/AzureOpenAIChatClient reuse
# `openai` (already in `rag`) and `azure-identity` (already in `rag-azure`),
# so they need no extra of their own.
# httpx is needed here specifically: Azure AI Search index aliases were
# briefly in the SDK as a beta feature (11.4.0b1) but removed before the
# stable 11.4.0 release and have not been restored in any version since
# (verified against the SDK's own CHANGELOG.md) -- alias management is
# implemented as direct REST calls (see vector_stores/azure_ai_search.py)
# since the typed client has no equivalent method.
rag-azure-search = [
    "azure-search-documents>=11.5.0,<12.0.0",
    "httpx>=0.27.0,<1.0.0",
]
all = [
    "dapr[fastapi,flask,grpc,langgraph,strands,workflow]",
    "dapr[rag,rag-langchain,rag-s3,rag-azure,rag-azure-search,rag-pgvector,rag-pinecone]",
    # rag-unstructured pulls in unstructured -> python-magic, which needs a
    # real libmagic for file-type sniffing. Windows has no system libmagic,
    # and python-magic's own compat shim (magic/compat.py) crashes the whole
    # process with a native access violation -- not a catchable ImportError
    # -- instead of failing cleanly when it can't find one. The standard
    # Windows workaround, python-magic-bin, isn't a fix here: it installs its
    # own `magic/__init__.py` at the same path as python-magic's, predates
    # (and lacks) compat.py entirely, and hasn't been released since 2017 --
    # pairing it with python-magic risks an install-order-dependent file
    # collision rather than a working combination. So `all` (this SDK's own
    # dev/test bundle) simply excludes rag-unstructured on Windows;
    # dapr/ext/rag/parsing/unstructured.py already handles unstructured
    # being absent via UnstructuredParser raising OptionalDependencyError
    # (see its own ImportError guard). Windows users who've separately sorted
    # out libmagic (e.g. via conda; see unstructured's own install docs) can
    # still `pip install dapr[rag-unstructured]` directly -- this exclusion
    # is scoped to `all` only. (Inlined rather than `dapr[rag-unstructured];
    # sys_platform != 'win32'`: uv silently drops a marker attached to a
    # self-referential extra like that -- verified against this exact case,
    # not assumed -- so it must go on the concrete requirement instead.)
    "unstructured[md,pdf,docx]>=0.15.0,<1.0.0; sys_platform != 'win32'",
]

[project.urls]
Documentation = "https://github.com/dapr/docs"
Source = "https://github.com/dapr/python-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = '(?P<version>\S+)'

[tool.hatch.build.targets.wheel]
# IMPORTANT: do NOT introduce dapr/ext/__init__.py. `dapr.ext` is kept as an
# implicit PEP 420 namespace package so external plugins can publish their own
# distributions under `dapr.ext.*` without colliding with this wheel's
# `RECORD`. Materialising `dapr/ext/__init__.py` here would lock out every
# future externally-published dapr.ext.* plugin by claiming ownership of the
# namespace parent.
# TODO: drop flask_dapr in 1.22 (with the shim).
packages = ["dapr", "flask_dapr"]
# Repo-internal docs (contributor / AI-agent guidance) live next to the code
# for discoverability but should not ship in the published wheel.
exclude = [
    "**/AGENTS.md",
    "dapr/ext/*/README.md",
]

# No workspace members. Before the bundling, each extension was a separate
# workspace package under ext/. Now all extension code lives in the core
# `dapr` package and is opt-in via [project.optional-dependencies].
[tool.uv.workspace]
members = []

[tool.uv]
constraint-dependencies = [
    # onnxruntime (pulled in transitively via rag-unstructured's unstructured[pdf]
    # -> unstructured-inference, for PDF parsing) dropped cp310 wheels starting at
    # 1.24.1 -- verified against PyPI's actual file listing, not just metadata.
    # Pin to the last cp310-compatible release so `uv lock`/`uv sync` doesn't pick
    # a version with no installable wheel for this project's Python 3.10 floor.
    # python_version >= 3.11 is unaffected and resolves onnxruntime normally.
    "onnxruntime<1.24; python_version < '3.11'",
]

[dependency-groups]
dev = [
    # Pull in every extension's third-party deps so the full test suite runs
    # in the dev env. `dapr` here resolves to this workspace project itself,
    # so `dapr[all]` activates every extras list declared above.
    "dapr[all]",
    "mypy==2.3.0",
    "mypy-extensions~=1.1.0",
    "mypy-protobuf==5.0.0",
    "grpcio-tools==1.81.1",
    "types-python-dateutil~=2.9.0",
    "types-grpcio-status~=1.0.0",
    "coverage>=7.13.4,<7.16.0",
    "wheel~=0.46.3",
    "opentelemetry-sdk>=1.40,<1.45",
    "opentelemetry-instrumentation-grpc~=0.61b0",
    "opentelemetry-exporter-zipkin~=1.11.1",
    "httpx~=0.28.1",
    "cryptography>=49.0.0",
    "redis>=7.4.0",
    "Flask~=3.1.3",
    "pytest>=9.0.2,<9.2.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.19",
    "python-dotenv~=1.2.2",
    "pydantic~=2.13.3",
    "PyYAML~=6.0.3",
]
tests = [
    {include-group = "dev"},
    "mechanical-markdown~=0.8.0",
    "langchain-ollama>=1.0.1,<1.2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
fix = true
extend-exclude = [".github", "dapr/proto", "dapr/ext/workflow/_durabletask/internal/*_pb2*"]
# Honor extend-exclude even when ruff is invoked with explicit file paths
# (pre-commit hooks, lint-staged, manual debugging). Without this, ruff would
# happily lint and "fix" the generated `*_pb2.py` stubs and strip the
# `import attestation_pb2` lines that the protobuf descriptor pool needs.
force-exclude = true

[tool.ruff.lint]
select = [
    "I",  # isort
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "E",  # pycodestyle errors

    # TODO: Add those back progressively as we fix the issues
    # "C",  # flake8-comprehensions
    # "B",  # flake8-bugbear
    # "UP",  # pyupgrade
]

# TODO: Add those back progressively as we fix the issues
ignore = ["E501", "E203", "E712", "E722", "E713"]

[tool.ruff.lint.isort]
# Extensions now live inside the core `dapr` wheel, so `dapr` and the
# `flask_dapr` shim are first-party, not third-party imports.
known-first-party = ["dapr", "flask_dapr"]
# Without this, same-package autodetection on files under `dapr/ext/*` keeps
# `dapr` in the third-party group, so the first-party setting above never
# takes effect for the bundled extensions.
detect-same-package = false

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = "3.10"
install_types = true
non_interactive = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
check_untyped_defs = true
namespace_packages = true
packages = [
    "dapr",
    "flask_dapr",
]

[[tool.mypy.overrides]]
module = ["dapr.proto.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["grpc.aio"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "strands.*", "strands_agents.*"]
ignore_missing_imports = true

# dapr.ext.rag's optional adapters: some of these (boto3, langchain_core) are
# installed in CI/dev without inline type stubs or only via a transitive
# extra; others (azure-*, psycopg, pinecone, unstructured) may not be
# installed at all, since every dapr.ext.rag adapter guards its own optional
# import (see dapr/ext/rag/AGENTS.md) rather than requiring the full `rag-*`
# extra set. Unlike the fastapi/langgraph/strands/workflow modules below,
# dapr.ext.rag is new code and is NOT in the ignore_errors bucket -- it is
# expected to pass mypy cleanly.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore.*",
    "azure.*",
    "psycopg.*",
]
ignore_missing_imports = true

# unstructured (pdf/docx extras), openai, pinecone, and langchain-core all
# transitively pull in numpy -- openai, pinecone, and langchain-core each
# reference numpy array/vector types directly from their own inline stubs,
# and unstructured's pdf/docx extras drag in a large ML stack (pandas, spacy,
# transformers, onnx, ...) that does the same. dapr.ext.rag never imports
# numpy itself. Recent numpy versions bundle stubs/source using PEP 695
# generic syntax that mypy cannot parse under this project's python_version =
# "3.10" target, and unlike a normal type error, a syntax error aborts the
# *entire* mypy run, not just dapr.ext.rag. follow_imports = "skip" keeps
# mypy from following past the one place dapr.ext.rag actually imports each
# of these (parsing/unstructured.py, embedding/_openai_common.py,
# generation.py, vector_stores/pinecone.py, parsing/langchain.py) into that
# graph, so numpy's own files are never opened; ignore_missing_imports covers
# environments where a given package isn't installed at all (each is an
# optional dependency here). Verified (see the completion report) that a
# plain `import numpy` reached this way still crashes mypy even when numpy
# itself is separately skipped or stub-shadowed -- skipping has to happen at
# the direct import site, not at the transitively-reached destination.
[[tool.mypy.overrides]]
module = ["unstructured.*", "openai.*", "pinecone.*", "langchain_core.*"]
follow_imports = "skip"
ignore_missing_imports = true

# Bundling the extensions into the core wheel brings their source under mypy's
# namespace walk for the first time. These modules carry pre-existing type
# errors that were previously hidden by the separate-workspace-package layout.
# Ignored here to keep this packaging PR scope-limited; clean up in a follow-up.
# TODO: drop these overrides as each module's type errors are fixed.
[[tool.mypy.overrides]]
module = [
    "dapr.ext.fastapi.*",
    "dapr.ext.langgraph.*",
    "dapr.ext.strands.*",
    "dapr.ext.workflow.*",
]
ignore_errors = true

[tool.pytest.ini_options]
markers = [
    'example_dir(name): set the example directory for the dapr fixture',
    'perf: timing-sensitive dispatch regression tests',
    'e2e: tests requiring a running Dapr sidecar',
    'dapr_head: tests requiring a daprd built from dapr/dapr master, not a release',
]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
# Without `source`, files never imported by the test run are invisible to
# coverage and silently inflate the total reported to codecov.
source = ['dapr', 'flask_dapr']
# Leading ** keeps the pattern cwd-independent: coverage absolutizes
# non-wildcard patterns against the invocation directory, so a bare
# 'dapr/proto/**' only matches when run from the repo root.
omit = ['**/dapr/proto/**']
