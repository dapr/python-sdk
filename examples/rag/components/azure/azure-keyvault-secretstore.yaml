# Dapr secret store component for Azure Key Vault.
#
# OPTIONAL. Only needed if a deployment chooses to keep some secret (e.g. a
# dev-only API key) outside of managed/workload identity -- the recommended
# deployment of this pipeline needs no secrets at all, and this component
# should simply not be deployed in that case
# (examples/rag/infra/main.bicep's `deploySecretStore` defaults to false and
# provisions no Key Vault when left at that default).
#
# Placeholders (replace before use, e.g. from the Bicep outputs):
#   <KEYVAULT_NAME>                 -> Bicep output keyVaultName
#   <INGESTION_IDENTITY_CLIENT_ID>  -> Bicep output ingestionIdentityClientId
#
# Metadata field reference verified against
# https://docs.dapr.io/reference/components-reference/supported-secret-stores/azure-keyvault/
# on 2026-09-10.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: azure-keyvault
spec:
  type: secretstores.azure.keyvault
  version: v1
  metadata:
  # Required.
  - name: vaultName
    value: "<KEYVAULT_NAME>"

  # Optional. Client ID of the *user-assigned* managed identity that should
  # read from this vault. Omit for a system-assigned identity, in which
  # case vaultName is the only field this component needs.
  #
  # Deliberately not set here: azureTenantId / azureClientSecret /
  # azureCertificateFile(Password). Those are only required for
  # service-principal auth, which this sample avoids.
  - name: azureClientId
    value: "<INGESTION_IDENTITY_CLIENT_ID>"

# Which identity's client ID belongs above depends on which workload reads
# secrets through this component. If both the ingestion and query workloads
# need the same kind of dev-only fallback secret (e.g. an Azure OpenAI API
# key used instead of Microsoft Entra ID auth), deploy one rendered copy of
# this file per workload -- each with that workload's own azureClientId --
# and use `scopes` below so each copy is only loaded by its own app-id.
# Both identities are granted the "Key Vault Secrets User" role in
# examples/rag/infra/modules/rbac.bicep when deploySecretStore is true; see
# docs/rag/azure-rbac.md.
#
# scopes:
# - rag-ingestion-worker
