name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 3'
  branch_protection_rule:
    types: [created, edited, deleted]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard does not support forks.
    if: github.repository == 'dapr/python-sdk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # Read workflow metadata for Scorecard checks.
      security-events: write # Upload SARIF to code scanning.
      id-token: write # Publish results using GitHub OIDC.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Preserve generated results after a failure while respecting cancellation.
      - name: Upload SARIF artifact
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: ossf-scorecard
