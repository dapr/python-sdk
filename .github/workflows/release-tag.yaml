# Creates the release tag only after checking that VERSION on the release
# branch holds the version being released. A hand-pushed tag is only checked
# by dapr-python-release once the tag already exists, which is how v1.19.0rc2
# ended up tagged on a commit whose VERSION still said 1.19.0rc1.
name: dapr-python-release-tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.19.0rc2. Must match VERSION on the selected release-X.Y branch.'
        required: true
        type: string

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true
        persist-credentials: false
    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
    - name: Verify VERSION is ready to release
      env:
        EXPECTED_VERSION: ${{ inputs.version }}
      run: |
        python tools/check_release_version.py \
          --expected "$EXPECTED_VERSION" \
          --branch "$GITHUB_REF" \
          --require-untagged
    - name: Create and push tag
      env:
        # A tag pushed with GITHUB_TOKEN does not trigger other workflows,
        # so the bot token is what lets this tag start dapr-python-release.
        # It is only handed to this step, not persisted by checkout.
        BOT_TOKEN: ${{ secrets.DAPR_BOT_TOKEN }}
      run: |
        release_tag="v$(tr -d '[:space:]' < VERSION)"
        git tag "$release_tag" "$GITHUB_SHA"
        git push "https://x-access-token:${BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
          "refs/tags/$release_tag"
        echo "Pushed $release_tag at $GITHUB_SHA; dapr-python-release publishes it." >> "$GITHUB_STEP_SUMMARY"
